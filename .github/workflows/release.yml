name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release codename'
        required: true
        type: string
      release_message:
        description: 'Release notes'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ inputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4

      - name: Stamp codename into app
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          from xml.sax.saxutils import escape

          tag = os.environ['VERSION_TAG']
          path = pathlib.Path('app/src/main/res/values/strings.xml')
          text = path.read_text()
          text, count = re.subn(
              r'(<string name="codename" translatable="false">).*?(</string>)',
              lambda match: match.group(1) + escape(tag) + match.group(2),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('codename string not found')
          path.write_text(text)
          PY

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/btgames.jks"

      - name: Build signed release APK
        env:
          BTGAMES_KEYSTORE_FILE: ${{ runner.temp }}/signing/btgames.jks
          BTGAMES_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          BTGAMES_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
          BTGAMES_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: sh gradlew :app:assembleRelease --no-daemon -Pcodename="$VERSION_TAG" -PbtgamesFlavor=github

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          NOTES=$(printf '%s\n\n%s' "$RELEASE_MESSAGE" "Thank you for playing BT Games! Please open up an issue if you find any bugs.")
          gh release create "$VERSION_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "$VERSION_TAG" \
            --notes "$NOTES"

